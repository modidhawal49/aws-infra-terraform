stages:
  - validate
  - download_state
  - plan
#  - apply

# default: set to "true" to use the repo-local .terraform/terraform.tfstate
variables:
  USE_LOCAL_STATE: "false"

image:
  name: hashicorp/terraform:1.13.1
  entrypoint: [""]

workflow:
  rules:
    - if: '$CI_COMMIT_REF_NAME == "nonprod"'
      when: always
    - if: '$CI_COMMIT_REF_NAME == "prod"'
      when: always
    - when: never

# ===============================
# VALIDATE (nonprod)
# ===============================
VALIDATE:nonprod:
  stage: validate
  image: hashicorp/terraform:1.13.1
  before_script:
    - echo "Selecting AWS Environment based on branch..."
    - |
      if [[ "$CI_COMMIT_REF_NAME" == "nonprod" ]]; then
        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_NONPROD"
        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_NONPROD"
        export AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION_NONPROD"
        export TF_BUCKET="$TF_STATE_BUCKET_NONPROD"
        export TF_KEY="$TF_STATE_KEY_NONPROD"
        export TF_ENVIRONMENT="nonprod"
      fi
    - mkdir -p ~/.aws
    - |
      cat > ~/.aws/credentials <<EOF
      [default]
      aws_access_key_id=$AWS_ACCESS_KEY_ID
      aws_secret_access_key=$AWS_SECRET_ACCESS_KEY
      EOF
    - |
      cat > ~/.aws/config <<EOF
      [default]
      region=$AWS_DEFAULT_REGION
      EOF

  script:
    - echo "TF_BUCKET=\"$TF_STATE_BUCKET_NONPROD\""
    - echo "TF_KEY=\"$TF_STATE_KEY_NONPROD\""
    - echo "AWS_DEFAULT_REGION=\"$AWS_DEFAULT_REGION_NONPROD\""
    - |
      if [[ -z "$TF_BUCKET" || -z "$TF_KEY" ]] && [[ "$USE_LOCAL_STATE" != "true" ]]; then
        echo "ERROR: TF_BUCKET or TF_KEY is empty and USE_LOCAL_STATE != true. Ensure CI variables TF_STATE_BUCKET_* and TF_STATE_KEY_* are configured or set USE_LOCAL_STATE=true."
        exit 1
      fi
    - |
      if ! command -v git >/dev/null 2>&1; then
        echo "git not found — attempting to install"
        if command -v apk >/dev/null 2>&1; then apk add --no-cache git || true; fi
        if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y git || true; fi
      fi

    # If using local state from repo, disable backend and use local terraform state file if present.
    - |
      if [[ "$USE_LOCAL_STATE" == "true" ]]; then
        echo "Using local state from repository (.terraform/terraform.tfstate) - disabling remote backend for this run."
        if [[ -f .terraform/terraform.tfstate ]]; then
          mkdir -p .terraform || true
          # copy to working location terraform expects by default
          cp .terraform/terraform.tfstate ./terraform.tfstate || true
          echo "Copied .terraform/terraform.tfstate -> ./terraform.tfstate"
        else
          echo "Warning: .terraform/terraform.tfstate not found in repo. Proceeding without a pre-existing local state file."
        fi
        terraform init -upgrade
        if [[ $? -ne 0 ]]; then
          echo "terraform init failed — aborting"
          exit 1
        fi
      else
        echo "Using remote state backend (S3)."
        terraform init -upgrade -backend-config="bucket=$TF_BUCKET" -backend-config="key=$TF_KEY" -backend-config="region=$AWS_DEFAULT_REGION" -reconfigure
        if [[ $? -ne 0 ]]; then
          echo "terraform init failed — aborting"
          exit 1
        fi
      fi

    - terraform validate

  rules:
    - if: '$CI_COMMIT_REF_NAME == "nonprod"'

  tags:
    - nonprod

# ===============================
# DOWNLOAD_STATE (nonprod)
# ===============================
# When using local state we skip the S3 download job (no-op). Keep job but it will be short-circuited.
DOWNLOAD_STATE:nonprod:
  stage: download_state
  image: amazon/aws-cli:2.14.0
  variables:
    AWS_DEFAULT_OUTPUT: "json"
  before_script:
    - echo "Selecting AWS Environment based on branch..."
    - |
      if [[ "$CI_COMMIT_REF_NAME" == "nonprod" ]]; then
        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_NONPROD"
        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_NONPROD"
        export AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION_NONPROD"
        export TF_BUCKET="$TF_STATE_BUCKET_NONPROD"
        export TF_KEY="$TF_STATE_KEY_NONPROD"
        export TF_ENVIRONMENT="nonprod"
      fi
    - mkdir -p ~/.aws
    - |
      cat > ~/.aws/credentials <<EOF
      [default]
      aws_access_key_id=$AWS_ACCESS_KEY_ID
      aws_secret_access_key=$AWS_SECRET_ACCESS_KEY
      EOF
    - |
      cat > ~/.aws/config <<EOF
      [default]
      region=$AWS_DEFAULT_REGION
      output=json
      EOF

  script:
    - |
      if [[ "$USE_LOCAL_STATE" == "true" ]]; then
        echo "USE_LOCAL_STATE=true — skipping S3 download. Relying on .terraform/terraform.tfstate in repository (if present)."
        mkdir -p artifacts || true
        # Provide an empty artifact file to satisfy downstream dependencies if needed
        touch artifacts/remote.tfstate || true
        ls -l artifacts || true
      else
        echo "AWS identity (for debug):"
        aws sts get-caller-identity || true
        echo "Downloading state from s3://$TF_BUCKET/$TF_KEY"
        mkdir -p artifacts
        aws s3 cp "s3://$TF_BUCKET/$TF_KEY" artifacts/remote.tfstate
        ls -l artifacts || true
        stat -c "%s %n" artifacts/remote.tfstate || true
      fi

  artifacts:
    paths:
      - artifacts/remote.tfstate
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_REF_NAME == "nonprod"'

  tags:
    - nonprod

# ===============================
# PLAN (nonprod)
# ===============================
PLAN:nonprod:
  stage: plan
  image: hashicorp/terraform:1.13.1
  dependencies:
    - DOWNLOAD_STATE:nonprod
  before_script:
    - echo "Selecting AWS Environment based on branch..."
    - |
      if [[ "$CI_COMMIT_REF_NAME" == "nonprod" ]]; then
        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_NONPROD"
        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_NONPROD"
        export AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION_NONPROD"
        export TF_BUCKET="$TF_STATE_BUCKET_NONPROD"
        export TF_KEY="$TF_STATE_KEY_NONPROD"
        export TF_ENVIRONMENT="nonprod"
      fi
    - mkdir -p ~/.aws
    - |
      cat > ~/.aws/credentials <<EOF
      [default]
      aws_access_key_id=$AWS_ACCESS_KEY_ID
      aws_secret_access_key=$AWS_SECRET_ACCESS_KEY
      EOF
    - |
      cat > ~/.aws/config <<EOF
      [default]
      region=$AWS_DEFAULT_REGION
      output=json
      EOF

  script:
    - echo "Listing artifacts provided to this job (should include artifacts/remote.tfstate if using remote):"
    - ls -la || true
    - |
      if [[ "$USE_LOCAL_STATE" == "true" ]]; then
        echo "Using local state from repository for plan."
        if [[ -f .terraform/terraform.tfstate ]]; then
          echo "Found .terraform/terraform.tfstate (size: $(stat -c '%s' .terraform/terraform.tfstate) bytes). Copying to ./terraform.tfstate"
          cp .terraform/terraform.tfstate ./terraform.tfstate || true
        else
          echo "No .terraform/terraform.tfstate present in repo. Proceeding - terraform will use whatever local state exists (or none)."
        fi

        # init but disable backend so it doesn't try to configure S3
        terraform init -upgrade -reconfigure
        # We run plan without refresh to avoid touching remote state (refresh-only might attempt AWS calls).
        terraform plan -var-file="${TF_ENVIRONMENT}.tfvars" -out=tfplan || true
      else
        # Use remote backend (S3) as before
        if [[ -f artifacts/remote.tfstate ]]; then
          echo "Remote state artifact present (downloaded earlier)."
        fi
        terraform init -upgrade -backend-config="bucket=$TF_BUCKET" -backend-config="key=$TF_KEY" -backend-config="region=$AWS_DEFAULT_REGION" -reconfigure
        terraform plan -var-file="${TF_ENVIRONMENT}.tfvars" -out=tfplan || true
      fi

    - |
      if [[ -f tfplan ]]; then
        terraform show -no-color tfplan || true
      else
        echo "No tfplan file produced."
      fi

  rules:
    - if: '$CI_COMMIT_REF_NAME == "nonprod"'

  tags:
    - nonprod

